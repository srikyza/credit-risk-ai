name: credit-risk-pipeline

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run end-to-end pipeline
        run: python run_pipeline.py
      - name: Publish report as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: credit-risk-report
          path: |
            reports/
            outputs/
            models/
